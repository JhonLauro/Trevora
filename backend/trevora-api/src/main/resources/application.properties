spring.application.name=trevora-api
spring.config.import=optional:file:.env[.properties],optional:file:backend/trevora-api/.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.data-source-properties.prepareThreshold=0

supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}

server.port=${PORT:8080}

trevora.ocr.provider=${OCR_PROVIDER:mock}
trevora.ocr.tesseract.path=${TESSERACT_PATH:tesseract}
trevora.ocr.tessdata.path=${TESSDATA_PATH:}
trevora.ai.extraction.provider=${AI_EXTRACTION_PROVIDER:mock}
trevora.ai.openai.api-key=${OPENAI_API_KEY:}
trevora.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
trevora.voice.openai.raw-transcription-model=${OPENAI_RAW_TRANSCRIPTION_MODEL:${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}}
trevora.voice.openai.text-translation-model=${OPENAI_TEXT_TRANSLATION_MODEL:gpt-4o}
