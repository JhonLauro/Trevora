spring.application.name=trevora-api
# One .env at the repository root, shared with the frontend.
# Both paths resolve to it: the first when run from the repo root, the
# second when run from backend/trevora-api (what mvnw.cmd does).
# The old second path pointed at backend/trevora-api/.env, which only
# resolved when run from the root -- so running the documented way read
# no config at all, and both imports being `optional:` made that silent.
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.data-source-properties.prepareThreshold=0

supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
# The project's JWT secret (Dashboard -> Project Settings -> API -> JWT Secret).
# With it, an access token is verified in-process instead of by a call to
# Supabase Auth on every request. Leave unset and the API still works -- it
# just makes that call, and goes down whenever Auth does.
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# Admin key, used only to delete an account: removing an auth user and removing
# storage objects are both operations the anon key cannot perform. Never sent to
# the browser -- it has no VITE_ prefix, so Vite will not expose it.
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

server.port=${PORT:8080}

trevora.ocr.provider=${OCR_PROVIDER:mock}
trevora.ocr.google-vision.api-key=${GOOGLE_CLOUD_VISION_API_KEY:}
trevora.ai.extraction.provider=${AI_EXTRACTION_PROVIDER:mock}
trevora.ai.openai.api-key=${OPENAI_API_KEY:}
trevora.ai.openai.model=${OPENAI_MODEL:gpt-5.4-mini}
trevora.mechanic-search.openai.model=${OPENAI_MECHANIC_SEARCH_MODEL:gpt-5.4-mini}
trevora.voice.openai.raw-transcription-model=${OPENAI_RAW_TRANSCRIPTION_MODEL:${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}}
trevora.voice.openai.text-translation-model=${OPENAI_TEXT_TRANSLATION_MODEL:${OPENAI_MODEL:gpt-5.4-mini}}

trevora.cors.allowed-origins=${TREVORA_CORS_ALLOWED_ORIGINS:}
# The browser app's origin, used to build the URL inside a share QR code.
# Leave unset to fall back to the first entry of the CORS origins above,
# which is the same address in every deployment we have.
trevora.frontend-base-url=${TREVORA_FRONTEND_BASE_URL:}

# Endpoints that call OpenAI or Google Vision on our key are rate limited per
# caller: per minute to stop a burst, per day to stop a slow drip. Mechanic
# search is keyed by session id because it has no signed-in user.
trevora.ai.rate-limit.enabled=${TREVORA_AI_RATE_LIMIT_ENABLED:true}
trevora.ai.rate-limit.per-minute=${TREVORA_AI_RATE_LIMIT_PER_MINUTE:10}
trevora.ai.rate-limit.per-day=${TREVORA_AI_RATE_LIMIT_PER_DAY:100}
# Per caller, per feature. These are the everyday anti-spam limits: a burst limit
# per minute and a slow-drip limit per day, sized so a real owner never meets them.
# Each voice step (transcribe, translate, save) has its own bucket at the voice limits.
# Receipts are counted in PAGES, not uploads -- pages are what cost money, and a
# casa service can hand over nine pages at once. The per-minute upload count only
# stops button hammering. The hour and the day come back whole when they end, and
# the receipt screen shows the owner their usage and the reset time.
trevora.ai.limit.receipt.uploads-per-minute=${TREVORA_AI_LIMIT_RECEIPT_UPLOADS_PER_MINUTE:10}
trevora.ai.limit.receipt.pages-per-hour=${TREVORA_AI_LIMIT_RECEIPT_PAGES_PER_HOUR:100}
trevora.ai.limit.receipt.pages-per-day=${TREVORA_AI_LIMIT_RECEIPT_PAGES_PER_DAY:350}
# Spam protection for the receipt reader. Requests the limits above refuse are counted
# per account (the receipt screen never sends one that would not fit, so these come
# from scripts). This many refusals inside the window is one strike; the first strike
# is a warning, the second a final warning, the third suspends the account. Strikes
# are at least the spacing apart, so one burst is one strike, and count for the memory.
trevora.abuse.enabled=${TREVORA_ABUSE_ENABLED:true}
trevora.abuse.refusals-per-strike=${TREVORA_ABUSE_REFUSALS_PER_STRIKE:5}
trevora.abuse.window-minutes=${TREVORA_ABUSE_WINDOW_MINUTES:10}
trevora.abuse.strike-spacing-minutes=${TREVORA_ABUSE_STRIKE_SPACING_MINUTES:30}
trevora.abuse.strike-memory-days=${TREVORA_ABUSE_STRIKE_MEMORY_DAYS:30}
trevora.ai.limit.voice.per-minute=${TREVORA_AI_LIMIT_VOICE_PER_MINUTE:5}
trevora.ai.limit.voice.per-day=${TREVORA_AI_LIMIT_VOICE_PER_DAY:40}
trevora.ai.limit.explanation.per-minute=${TREVORA_AI_LIMIT_EXPLANATION_PER_MINUTE:20}
trevora.ai.limit.explanation.per-day=${TREVORA_AI_LIMIT_EXPLANATION_PER_DAY:200}
trevora.ai.limit.mechanic-search.per-minute=${TREVORA_AI_LIMIT_MECHANIC_SEARCH_PER_MINUTE:10}
trevora.ai.limit.mechanic-search.per-day=${TREVORA_AI_LIMIT_MECHANIC_SEARCH_PER_DAY:100}
# AI searches one approved mechanic session may spend over its whole life,
# counted on the session row. Past it, search falls back to keyword matching.
trevora.mechanic-search.ai-budget-per-session=${TREVORA_MECHANIC_SEARCH_AI_BUDGET:30}

# The ceiling on what the WHOLE APP may spend on OpenAI and Google Vision, per UTC
# day and per month, persisted in ai_usage_daily (migration 025) so a restart
# cannot reset it. Past either limit every paid call is refused until the period
# turns over. The per-caller limits above cap one account; this caps the total.
# This is a BACKSTOP, not a usage limit: reaching it pauses AI for everyone, so set
# it well above normal use -- to what you can afford to lose to a bug overnight.
trevora.ai.budget.enabled=${TREVORA_AI_BUDGET_ENABLED:true}
trevora.ai.budget.daily-usd=${TREVORA_AI_BUDGET_DAILY_USD:5.00}
trevora.ai.budget.monthly-usd=${TREVORA_AI_BUDGET_MONTHLY_USD:30.00}
# Estimated AI spend one caller may run up in a UTC day. Reaching it pauses only that
# caller -- the spammer -- and everyone else carries on. 0 turns it off.
trevora.ai.budget.per-user-daily-usd=${TREVORA_AI_BUDGET_PER_USER_DAILY_USD:1.50}
# A Discord or Slack incoming webhook. Alerts at 50/80/100% of either limit and on
# an unusual hour; without it they are only error lines in the log.
trevora.ai.budget.alert-webhook-url=${TREVORA_AI_ALERT_WEBHOOK_URL:}
# List prices the spend is ESTIMATED with. They default to gpt-4o's, the dearest
# model this app has used, so the estimate errs high. Set them to your models'
# current prices from the provider pricing pages for an accurate figure.
trevora.ai.price.chat-input-per-million-usd=${TREVORA_AI_PRICE_CHAT_INPUT_PER_MILLION_USD:2.50}
trevora.ai.price.chat-output-per-million-usd=${TREVORA_AI_PRICE_CHAT_OUTPUT_PER_MILLION_USD:10.00}
trevora.ai.price.transcription-per-minute-usd=${TREVORA_AI_PRICE_TRANSCRIPTION_PER_MINUTE_USD:0.006}
trevora.ai.price.vision-per-thousand-usd=${TREVORA_AI_PRICE_VISION_PER_THOUSAND_USD:1.50}

# Pages one receipt upload may carry. Each page is a separate billed Google
# Vision call made while the caller waits.
trevora.receipt.max-pages=${TREVORA_RECEIPT_MAX_PAGES:10}
# Bytes one receipt page may weigh (10 MB). The multipart ceiling below has to
# clear a voice recording, so it is no limit at all for a photo.
trevora.receipt.max-page-bytes=${TREVORA_RECEIPT_MAX_PAGE_BYTES:10485760}

# Multipart limits, chosen rather than inherited. Boot defaults to 1 MB per
# file, which is under what a phone camera produces: receipt photos are
# downscaled client-side to about a megabyte, but the browsers that cannot
# decode HEIC send the original untouched, so the default was rejecting real
# uploads. The per-file ceiling is set by the largest legitimate single file,
# which is a voice recording -- 25 MB, matching the check
# VoiceTranscriptionService already makes. That check was dead code until now:
# Boot rejected at 1 MB long before it ran.
#
# The request ceiling allows a full ten-page receipt with headroom without
# allowing ten times the per-file limit in one request. Each path enforces its
# own real limit below these; these are the outer bound.
spring.servlet.multipart.max-file-size=${TREVORA_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${TREVORA_MAX_REQUEST_SIZE:60MB}
# Spill to disk immediately instead of buffering uploads in heap.
spring.servlet.multipart.file-size-threshold=0B
