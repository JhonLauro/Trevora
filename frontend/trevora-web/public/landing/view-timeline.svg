<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Timeline view: service records newest first, with an empty year left as a visible gap">
  <defs>
    <style>
      .s { font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
      .t { font-weight: 600; fill: #16211c; }
      .m { fill: #4c5a54; }
      .f { fill: #7a867f; }
      .n { font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace; fill: #16211c; font-weight: 500; }
    </style>
  </defs>

  <rect width="400" height="250" rx="20" fill="#ffffff"/>
  <rect x="0.75" y="0.75" width="398.5" height="248.5" rx="19.25" fill="none" stroke="#e5eae7" stroke-width="1.5"/>

  <!-- year rule -->
  <text class="s t" x="24" y="34" font-size="14">2026</text>
  <line x1="62" y1="29" x2="376" y2="29" stroke="#e9efec" stroke-width="1.5"/>

  <!-- spine -->
  <line x1="34" y1="46" x2="34" y2="196" stroke="#e5eae7" stroke-width="2"/>

  <!-- entry 1 -->
  <circle cx="34" cy="58" r="5" fill="#0e7a52"/>
  <text class="s t" x="52" y="55" font-size="13">Preventive maintenance</text>
  <text class="s m" x="52" y="71" font-size="11">7 May · Toyota Otis, Manila</text>
  <text class="n" x="376" y="57" font-size="12" text-anchor="end">4,850</text>

  <!-- entry 2 -->
  <circle cx="34" cy="102" r="5" fill="#0e7a52"/>
  <text class="s t" x="52" y="99" font-size="13">Brake pads, front</text>
  <text class="s m" x="52" y="115" font-size="11">2 Feb · RSC Autoworks</text>
  <text class="n" x="376" y="101" font-size="12" text-anchor="end">2,400</text>

  <!-- the gap: an empty year, left visible -->
  <text class="s f" x="24" y="146" font-size="14">2025</text>
  <line x1="62" y1="141" x2="376" y2="141" stroke="#eff3f1" stroke-width="1.5"/>
  <line x1="34" y1="152" x2="34" y2="176" stroke="#d8e1dc" stroke-width="2" stroke-dasharray="3 5"/>
  <text class="s f" x="52" y="167" font-size="11">Nothing filed this year</text>

  <!-- entry 3 -->
  <text class="s t" x="24" y="212" font-size="14">2024</text>
  <line x1="62" y1="207" x2="376" y2="207" stroke="#e9efec" stroke-width="1.5"/>
  <circle cx="34" cy="230" r="5" fill="#0e7a52"/>
  <text class="s t" x="52" y="227" font-size="13">Body &amp; paint restoration</text>
  <text class="n" x="376" y="229" font-size="12" text-anchor="end">10,500</text>
</svg>
