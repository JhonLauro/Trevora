# Render Blueprint for Trevora.
# Dashboard -> New -> Blueprint -> pick this repo. Values marked
# `sync: false` are secrets: Render prompts for them, they are never
# committed here.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: trevora-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend/trevora-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Supabase Postgres. Use the *connection pooler* URI (port 6543,
      # host aws-*.pooler.supabase.com) -- Render egress is IPv4-only and
      # the direct db.<ref>.supabase.co host is IPv6-only.
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Project Settings -> API -> JWT Secret. Lets the API verify access
      # tokens itself rather than calling Supabase Auth on every request,
      # which is what kept the whole API tied to that service's health.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Project Settings -> API -> service_role (secret). Used only by
      # DELETE /api/auth/account: removing a Supabase auth user and clearing
      # receipt objects from Storage are both beyond the anon key. Account
      # deletion refuses to run without it rather than half-deleting, so
      # leaving this unset disables the feature rather than breaking it.
      # Bypasses RLS entirely -- it belongs to the API service only, never
      # the static site.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Browser origins allowed to call the API, comma-separated. Set to
      # the static site's URL, e.g. https://trevora-web.onrender.com
      # (no trailing slash), plus any custom domain.
      - key: TREVORA_CORS_ALLOWED_ORIGINS
        sync: false
      # The browser app's origin, written into every share QR code. Optional:
      # left unset, the API uses the first CORS origin above, which is the same
      # address. Set it only if the two ever differ -- a custom domain, say.
      - key: TREVORA_FRONTEND_BASE_URL
        sync: false
      - key: OCR_PROVIDER
        value: google-vision
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: AI_EXTRACTION_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false

  # ----------------------------------------------------------- frontend
  - type: web
    name: trevora-web
    runtime: static
    rootDir: frontend/trevora-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Full API base including /api, e.g.
      # https://trevora-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Optional: defaults to `service-receipts` in code. Set only if the
      # Supabase storage bucket has a different name.
      - key: VITE_SUPABASE_RECEIPT_BUCKET
        sync: false
    routes:
      # React Router owns the paths; every deep link must serve index.html
      # instead of Render's 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # ------------------------------------------------ Content Security Policy
      #
      # Auth here is a bearer token in localStorage, not a cookie, so there is
      # no CSRF to defend against -- but there is also no HttpOnly. Any script
      # that runs on this origin can read the access AND refresh tokens, and the
      # refresh token mints new access tokens indefinitely. Preventing a foreign
      # script from running IS the token security; this is the control that does
      # it.
      #
      # The app's own code cannot realistically produce an XSS -- no innerHTML,
      # no dangerouslySetInnerHTML, React escapes by default -- so the realistic
      # way a script gets here is a compromised npm package. `script-src 'self'`
      # stops it running; `connect-src` stops it phoning the tokens home even if
      # it did.
      #
      # Every value below was measured against the built output rather than
      # assumed:
      #   - dist/index.html has zero inline <script> and zero inline <style>,
      #     so neither 'unsafe-inline' nor a nonce is needed.
      #   - driver.js (the walkthrough) styles elements through the CSSOM
      #     (el.style.x = ...), which CSP does not police, and injects no <style>
      #     tag -- so style-src stays strict too.
      #   - The only off-origin assets are the two Google Fonts stylesheets in
      #     index.html and the font files they pull from fonts.gstatic.com.
      #   - Receipt, avatar and vehicle images come from Supabase Storage, which
      #     is the same host as VITE_SUPABASE_URL; blob: covers the ones read
      #     from a file input before upload.
      #
      # REPORT-ONLY ON PURPOSE. In this mode the browser reports what it would
      # have blocked and blocks nothing, so a wrong entry shows up in the
      # console instead of as a blank page on somebody's phone. Watch it, then
      # rename the header to `Content-Security-Policy` to enforce.
      #
      # Not applied in development: Vite's hot reload needs inline scripts and
      # eval, which this forbids. It belongs to the deployed site only, which is
      # also the only place that faces the internet.
      #
      # If the API ever moves off onrender.com, connect-src must be updated to
      # match or every request from the browser will be refused.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://bqardmkvbrfpbfmvmbgf.supabase.co; connect-src 'self' https://bqardmkvbrfpbfmvmbgf.supabase.co https://trevora-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

      # A mechanic's session id travels in the URL, which is exactly what
      # mechanicSessionToken.js warns about: URLs leak through history, logs and
      # `Referer` headers to anything the page loads. This page loads Google
      # Fonts, so without this the full share URL would be sent to Google on
      # every visit. `strict-origin-when-cross-origin` sends only the origin
      # off-site, which strips the session id while leaving same-origin
      # navigation reporting intact.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # Stops the browser second-guessing a Content-Type and executing something
      # served as data.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
