# Render Blueprint for Trevora.
# Dashboard -> New -> Blueprint -> pick this repo. Values marked
# `sync: false` are secrets: Render prompts for them, they are never
# committed here.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: trevora-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend/trevora-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Supabase Postgres. Use the *connection pooler* URI (port 6543,
      # host aws-*.pooler.supabase.com) -- Render egress is IPv4-only and
      # the direct db.<ref>.supabase.co host is IPv6-only.
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Browser origins allowed to call the API, comma-separated. Set to
      # the static site's URL, e.g. https://trevora-web.onrender.com
      # (no trailing slash), plus any custom domain.
      - key: TREVORA_CORS_ALLOWED_ORIGINS
        sync: false
      # The browser app's origin, written into every share QR code. Optional:
      # left unset, the API uses the first CORS origin above, which is the same
      # address. Set it only if the two ever differ -- a custom domain, say.
      - key: TREVORA_FRONTEND_BASE_URL
        sync: false
      - key: OCR_PROVIDER
        value: google-vision
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: AI_EXTRACTION_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false

  # ----------------------------------------------------------- frontend
  - type: web
    name: trevora-web
    runtime: static
    rootDir: frontend/trevora-web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Full API base including /api, e.g.
      # https://trevora-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Optional: defaults to `service-receipts` in code. Set only if the
      # Supabase storage bucket has a different name.
      - key: VITE_SUPABASE_RECEIPT_BUCKET
        sync: false
    routes:
      # React Router owns the paths; every deep link must serve index.html
      # instead of Render's 404.
      - type: rewrite
        source: /*
        destination: /index.html
